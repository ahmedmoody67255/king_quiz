<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>KiNG QUIZ 👑</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- الشاشة الرئيسية -->

  <div id="startScreen" class="screen">

    <div class="crown">👑</div>

    <h1>
      KiNG <span>QUIZ</span>
    </h1>

    <p class="subtitle">
      فكّر بسرعة • جاوب صح • كن أنت الـ KiNG 👑
    </p>

    <div class="menu">

      <button onclick="startGame('solo')">
        👤 لاعب واحد
      </button>

      <button onclick="showTwoPlayers()">
        👥 لاعبان
      </button>

    </div>

  </div>


  <!-- شاشة أسماء اللاعبين -->

  <div id="playersScreen" class="screen hidden">

    <div class="game-logo">
      👑 KiNG QUIZ
    </div>

    <h2>
      مين هيلعب؟ 🎮
    </h2>

    <input
      id="player1"
      type="text"
      placeholder="اسم اللاعب الأول"
      maxlength="15">

    <input
      id="player2"
      type="text"
      placeholder="اسم اللاعب الثاني"
      maxlength="15">

    <button
      class="main-btn"
      onclick="startTwoPlayers()">

      ابدأ اللعبة 🔥

    </button>

    <button
      class="back-btn"
      onclick="backHome()">

      رجوع ←

    </button>

  </div>


  <!-- شاشة الأقسام -->

  <div id="categoryScreen" class="screen hidden">

    <div class="game-logo">
      👑 KiNG QUIZ
    </div>

    <h2>
      اختار القسم 🎯
    </h2>

    <div class="categories">

      <button onclick="selectCategory('football')">
        ⚽
        <span>كورة القدم</span>
      </button>

      <button onclick="selectCategory('history')">
        🏛️
        <span>تاريخ</span>
      </button>

      <button onclick="selectCategory('geography')">
        🌍
        <span>جغرافيا</span>
      </button>

      <button onclick="selectCategory('biology')">
        🧬
        <span>أحياء</span>
      </button>

      <button onclick="selectCategory('love')">
        ❤️
        <span>حب وعلاقات</span>
      </button>

      <button onclick="selectCategory('english')">
        🇬🇧
        <span>إنجليزي</span>
      </button>

      <button onclick="selectCategory('friends')">
        😂
        <span>قعدة صحاب</span>
      </button>

      <button onclick="selectCategory('politics')">
        🏛️
        <span>سياسة</span>
      </button>

      <button onclick="selectCategory('general')">
        🧠
        <span>معلومات عامة</span>
      </button>

      <button onclick="selectCategory('movies')">
        🎬
        <span>أفلام ومسلسلات</span>
      </button>

    </div>

  </div>


  <!-- شاشة الأسئلة -->

  <div id="quizScreen" class="screen hidden">

    <div class="quiz-top">

      <div>

        <small>الدور الحالي</small>

        <strong id="currentPlayer">
          اللاعب
        </strong>

      </div>

      <div class="score">

        ⭐

        <span id="score">
          0
        </span>

      </div>

    </div>


    <div class="progress">

      <div id="progressBar"></div>

    </div>


    <div class="question-number">

      السؤال

      <span id="questionNumber">
        1
      </span>

      من 10

    </div>


    <div class="timer">

      ⏱️

      <span id="timer">
        15
      </span>

    </div>


    <div class="question-box">

      <h2 id="question">
        السؤال
      </h2>

    </div>


    <div
      id="answers"
      class="answers">
    </div>


    <button
      id="nextBtn"
      class="next-btn hidden"
      onclick="nextQuestion()">

      السؤال التالي →

    </button>

  </div>


  <!-- شاشة تسليم الموبايل -->

  <div id="passScreen" class="screen hidden">

    <div class="pass-icon">
      📱
    </div>

    <h1>
      سلّم الموبايل
    </h1>

    <p>
      دلوقتي دور:
    </p>

    <h2 id="nextPlayer">
      اللاعب التالي
    </h2>

    <button
      class="main-btn"
      onclick="continueTurn()">

      أنا جاهز 🔥

    </button>

  </div>


  <!-- شاشة النتيجة -->

  <div id="resultScreen" class="screen hidden">

    <div class="winner-crown">
      👑
    </div>

    <h1 id="resultTitle">
      النتيجة
    </h1>

    <div id="resultText"></div>

    <button
      class="main-btn"
      onclick="location.reload()">

      العب تاني 🔥

    </button>

  </div>


  <script src="script.js"></script>

</body>

</html>
